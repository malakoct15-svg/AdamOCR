name: AdamOCR Processing

on:
  workflow_dispatch:
    inputs:
      action_id:
        description: 'Unique ID to track this request'
        required: true
        default: 'test'

jobs:
  process_ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR Script
        run: python ocr_script.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "AdamOCR Bot"
          git config --global user.email "bot@adamocr.local"
          git add result.txt
          git commit -m "Update OCR Results for ${{ github.event.inputs.action_id }}" || exit 0
          git push