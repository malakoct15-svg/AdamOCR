name: AdamOCR Processing

on:
  workflow_dispatch:
  push:
    paths:
      - 'input_images/**'

jobs:
  process_ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tesseract OCR and Arabic Language
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR Script
        run: python ocr_script.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "AdamOCR Bot"
          git config --global user.email "bot@adamocr.local"
          git add result.txt
          git commit -m "Update OCR Results" || exit 0
          git push